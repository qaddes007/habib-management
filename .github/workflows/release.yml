name: Build and publish Windows update

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund

      - name: Set unique release version
        id: release
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $package.version = "1.0.${{ github.run_number }}"
          $package | ConvertTo-Json -Depth 100 | Set-Content package.json
          $tag = "v$($package.version)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Build Windows installer
        run: npx electron-builder --win nsis --publish never

      - name: Publish installer and update metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ steps.release.outputs.tag }}"
          $tagRef = "refs/tags/$tag"
          $existingRef = git ls-remote origin $tagRef
          if ($LASTEXITCODE -ne 0) { throw "Could not check release tag $tag." }
          if ($existingRef) {
            $existingSha = ($existingRef -split '\s+')[0]
            if ($existingSha -ne $env:GITHUB_SHA) {
              throw "Release tag $tag already points to a different commit."
            }
          } else {
            gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs" -f ref=$tagRef -f sha=$env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw "Could not create release tag $tag." }
          }
          gh release create $tag --draft --title $tag --notes "S. HABIB STEEL & LASER CRAFT desktop release $tag"
          if ($LASTEXITCODE -ne 0) { throw "Could not create draft release $tag." }

          $assets = @(Get-ChildItem dist-electron -File | Where-Object {
            $_.Name -notlike '*uninstaller*' -and
            ($_.Extension -eq '.exe' -or $_.Extension -eq '.yml' -or $_.Extension -eq '.blockmap')
          })
          if (-not ($assets | Where-Object { $_.Extension -eq '.exe' })) {
            throw "Windows installer was not produced in dist-electron."
          }
          if (-not ($assets | Where-Object { $_.Name -eq 'latest.yml' })) {
            throw "electron-builder update metadata latest.yml was not produced."
          }

          $metadata = Get-Content dist-electron/latest.yml -Raw
          $metadataPath = [regex]::Match($metadata, '(?m)^path:\s*(.+)$').Groups[1].Value.Trim()
          if (-not $metadataPath) {
            throw "Could not read the installer path from latest.yml."
          }
          $metadataAsset = Join-Path dist-electron $metadataPath
          if (-not (Test-Path $metadataAsset)) {
            $installer = $assets | Where-Object { $_.Extension -eq '.exe' } | Select-Object -First 1
            Copy-Item -LiteralPath $installer.FullName -Destination $metadataAsset
            $blockmap = "$($installer.FullName).blockmap"
            if (Test-Path $blockmap) {
              Copy-Item -LiteralPath $blockmap -Destination "$metadataAsset.blockmap"
            }
          }
          if (-not (Test-Path $metadataAsset)) {
            throw "The installer path referenced by latest.yml was not produced."
          }
          $assets = @(Get-ChildItem dist-electron -File | Where-Object {
            $_.Name -notlike '*uninstaller*' -and
            ($_.Extension -eq '.exe' -or $_.Extension -eq '.yml' -or $_.Extension -eq '.blockmap')
          })

          gh release upload $tag @($assets.FullName) --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload all installer and update assets." }
          gh release edit $tag --draft=false
          if ($LASTEXITCODE -ne 0) { throw "Could not publish release $tag." }

        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
